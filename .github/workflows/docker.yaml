name: Build Docker image

on:
  push:
    branches: [ "dev" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest  # GitHub-hosted runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hello-python:ci .

      - name: Run container
        run: docker run --rm hello-python:ci
